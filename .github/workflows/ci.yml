# 자동 검사·배포·릴리스(CI/CD) — .github/workflows/ci.yml
# 읽는 순서: 84/84번째 · 8단계(설정·테스트·배포)
#   앞: wrangler.jsonc → 다음: 없음(마지막 파일이에요) (전체 순서와 문서 순서: docs/reading-order.md)
#
# 이 파일이 하는 일
#   1. 검사(check): main 브랜치에 올리거나(push) PR을 열 때마다 GitHub가 빈 컴퓨터(러너, runner)를 하나 빌려
#      설치 → 보안 취약점 → 타입 검사 → 린트(oxlint) → 단위 테스트(원고 형식 검사 포함) → 빌드 → E2E 테스트를 차례로 돌려요.
#      하나라도 실패하면 빨간 X가 떠서, 망가진 코드나 잘못 쓴 원고가 그대로 쌓이지 않게 막아 줘요.
#   2. 배포(deploy): main에 올라온 커밋이 검사를 통과하면 Cloudflare Workers에 올려요.
#      글쓰기 화면에서 저장한 리뷰도 main에 커밋으로 올라가서, 검사를 통과하면 몇 분 뒤 블로그에 보여요.
#      검사에 실패하면 배포하지 않아서, 블로그는 전에 올린 모습 그대로 남아요.
#   3. 릴리스(release): 배포까지 끝난 커밋의 package.json 버전에 아직 태그가 없으면
#      그 버전의 태그(v1.0.1 등)와 GitHub 릴리스를 만들어요. 릴리스 내용은 CHANGELOG.md의 그 버전 항목이에요.
#      버전을 올리지 않은 커밋(글쓰기 화면에서 저장한 리뷰 등)은 태그가 이미 있어서 건너뛰어요.
#      버전 규칙(유의적 버전)과 올리는 방법은 docs/development.md 5장 "버전과 릴리스"를 보세요.
#
# 배포에 쓰는 값(저장소 Settings → Secrets and variables → Actions)
#   - CLOUDFLARE_API_TOKEN(비밀 값): Workers에 올릴 수 있는 Cloudflare API 토큰
#   - CLOUDFLARE_ACCOUNT_ID(변수): Cloudflare 계정 번호. 이 값이 없으면 배포 단계는 건너뛰어요.
#   글쓴이 로그인·저장에 쓰는 비밀 값은 GitHub이 아니라 Cloudflare 워커에 있어요(docs/development.md 5장).
#
# 원고를 올렸는데 빨간 X가 떴다면?
#   GitHub 저장소의 Actions 탭 → 실패한 실행 → "단위 테스트" 단계를 열면
#   어느 원고의 어디를 어떻게 고칠지 한국어로 나와 있어요.
#
# GitHub Actions 문법 한눈에 보기
#   on: 언제 돌릴지 / jobs: 할 일 묶음(여기서는 check, deploy, release 세 개) / steps: 한 묶음 안에서 차례로 하는 단계
#   uses: 남이 만들어 둔 동작(action)을 가져다 써요. @v7은 그 동작의 판 번호예요.
#   run: 빌린 컴퓨터의 터미널에서 명령을 실행해요. name: Actions 화면에 보일 단계 이름이에요.
#   ${{ ... }}: GitHub가 채워 주는 값(브랜치 이름, 비밀 값 등)을 끼워 넣는 자리예요.

name: CI

# 언제 실행할까요?
on:
  push:
    branches: [main] # main에 올렸을 때
  pull_request: # PR을 열거나 고쳤을 때

# 같은 브랜치에서 새로 올리면, 앞서 돌던 검사·배포는 멈추고 새 것만 돌려요(시간 절약).
# 배포가 중간에 멈춰도 Cloudflare는 다 올라간 버전으로만 바꾸므로, 블로그가 반쯤 바뀌는 일은 없어요.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 이 작업에 필요한 권한: 저장소 코드를 읽기만 해요.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest # 빌려 쓰는 컴퓨터의 운영체제
    timeout-minutes: 20 # 20분이 넘으면 멈춰요(무한히 도는 일을 막아요).
    steps:
      # 1. 저장소 코드 받기
      - uses: actions/checkout@v7

      # 2. pnpm(라이브러리 설치 도구) 설치 (버전은 package.json의 packageManager를 따라요)
      - uses: pnpm/action-setup@v6

      # 3. Node.js 설치 (버전은 .node-version 파일을 따라요. 지금은 26). 받은 라이브러리를 캐시해 다음 실행을 빠르게 해요.
      #    with: 가져온 동작에 넘기는 설정값이에요.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # 4. 라이브러리 설치. --frozen-lockfile: pnpm-lock.yaml과 다르면 실패해요(모두가 같은 버전을 쓰게).
      #    허락하지 않은 빌드 스크립트가 있어도 여기서 실패해요(pnpm-workspace.yaml의 allowBuilds).
      - run: pnpm install --frozen-lockfile

      # 5. 운영에 쓰는 라이브러리(--prod: 개발용 도구는 빼요)에 알려진 높은 위험(high) 이상의 보안 취약점이 있으면 실패해요.
      - name: 보안 취약점 검사
        run: pnpm audit --prod --audit-level high

      # 6~8. 타입 검사, 린트, 단위 테스트(content/reviews 원고 형식 검사 포함)
      #   - 타입 검사(pnpm typecheck): next typegen으로 주소 타입을 만든 뒤 tsc --noEmit으로 타입 오류만 찾아요(파일은 만들지 않아요).
      #   - 린트(pnpm lint): oxlint가 코드에서 실수하기 쉬운 모양(안 쓰는 변수, 잘못된 훅 사용 등)을 찾아요.
      #   - 단위 테스트(pnpm test): Vitest로 src의 *.test.ts(x)를 돌려요(vitest.config.mts).
      - name: 타입 검사
        run: pnpm typecheck
      - name: 린트
        run: pnpm lint
      - name: 단위 테스트
        run: pnpm test

      # 9. 실제 원고로 빌드가 되는지 확인해요(배포와 같은 빌드).
      - name: 빌드
        run: pnpm build

      # 10. E2E: 시험용 원고로 다시 빌드한 뒤, 진짜 브라우저(Chromium)로 사이트를 써 봐요.
      #     로그인·글쓰기는 가짜 GitHub 서버(e2e/mock-github.mjs)와 시험용 계정으로 시험해요(playwright.config.ts가 띄워요).
      - name: E2E용 빌드
        run: pnpm e2e:build
      - name: Playwright 브라우저 설치
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E 테스트
        run: pnpm e2e

      # 실패했을 때만(if: failure()), 무슨 일이 있었는지 기록(test-results)을 7일 동안 보관해요. Actions 화면에서 내려받을 수 있어요.
      - name: E2E 실패 기록 보관
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  deploy:
    # 검사(check)가 성공해야만 시작해요.
    needs: check
    # main에 올렸을 때만 돌아요(PR에서는 돌지 않아요). Cloudflare 계정 번호 변수가 없으면 건너뛰어요.
    # &&는 "그리고"예요. 세 조건이 모두 맞아야 돌아요.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 1~4. 검사와 같은 준비: 코드 받기, pnpm·Node.js 설치, 라이브러리 설치
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 5. Workers용 빌드: next build 결과를 OpenNext 어댑터가 Workers용 코드(.open-next/)로 바꿔요(open-next.config.ts).
      - name: Workers용 빌드
        run: pnpm exec opennextjs-cloudflare build

      # 6. 배포: 미리 만든 화면의 캐시를 정적 파일에 채운 뒤 wrangler로 Cloudflare에 올려요(wrangler.jsonc).
      #    env: 이 단계에서만 쓰는 환경 변수예요. secrets.는 비밀 값(로그에 가려져요), vars.는 일반 변수예요.
      - name: Cloudflare에 배포
        run: pnpm exec opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  release:
    # 배포(deploy)가 성공해야만 시작해요. 배포를 건너뛰면(PR, 계정 번호 변수 없음) 이 단계도 건너뛰어요.
    #   그래서 릴리스가 있는 버전은 늘 블로그에 올라간 버전이에요.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 태그와 릴리스를 만들려면 저장소에 써야 해서, 이 단계에서만 쓰기 권한(contents: write)을 받아요.
    #   남이 만든 라이브러리를 설치해 돌리는 check·deploy는 맨 위의 읽기 권한 그대로예요.
    permissions:
      contents: write
    steps:
      # 1. 저장소 코드 받기(package.json의 버전과 CHANGELOG.md를 읽으려고요)
      - uses: actions/checkout@v7

      # 2. 새 버전이면 태그와 릴리스 만들기
      #    GH_TOKEN: GitHub가 이 실행에만 잠깐 빌려주는 토큰(github.token)이라, 따로 넣어 둘 비밀 값이 없어요.
      #    gh: GitHub 명령줄 도구(러너에 깔려 있어요). gh release create가 태그와 릴리스를 함께 만들어요.
      #    run: |는 여러 줄 명령이에요. 줄마다 차례로 실행하고, exit 0은 "성공으로 끝내기", exit 1은 "실패로 끝내기"예요.
      - name: 새 버전이면 태그와 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # package.json의 버전(예: 1.0.1)과 태그 이름(예: v1.0.1)
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          # 이 버전의 태그가 이미 있으면 할 일이 없어요(버전을 올리지 않은 커밋). 한 번 붙인 태그는 옮기지 않아요.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag 태그가 이미 있어 건너뛰어요."
            exit 0
          fi
          # CHANGELOG.md에서 "## 1.0.1 — 날짜"로 시작하는 줄을 찾아, 앞의 "## "를 뺀 나머지를 릴리스 제목으로 써요.
          #   awk: 글을 한 줄씩 읽어 조건에 맞는 줄을 고르는 도구. index(줄, 글자) == 1은 "줄이 그 글자로 시작한다"는 뜻이고,
          #   substr(줄, 4)는 넷째 글자부터 끝까지(앞의 "## " 세 글자를 뺀 나머지)예요.
          title=$(awk -v head="## $version " 'index($0, head) == 1 { print substr($0, 4); exit }' CHANGELOG.md)
          if [ -z "$title" ]; then
            echo "::error::CHANGELOG.md에 '## $version — 날짜' 항목이 없어요. 변경 기록을 적고 다시 올려 주세요."
            exit 1
          fi
          # 그 제목 줄 다음 줄부터, 다음 버전 제목("## ")이 나오기 전까지를 릴리스 내용(notes.md)으로 모아요.
          awk -v head="## $version " 'index($0, head) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          # --target: 방금 배포한 커밋($GITHUB_SHA)에 태그를 붙여요.
          gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md
